<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090704">
  <title>Read — Higher Authority Court Summons</title>
  <link rel="stylesheet" href="styles.css?v=page-fit-1">
  <style>
    .reader-shell { height: calc(100dvh - 3.75rem); }
    .book-stage { container-type: size; }
    .book-stage .book {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(100cqw, 181.8181818cqh);
      height: auto;
      aspect-ratio: 20 / 11;
      background: var(--paper);
    }
    .book .page-image { animation: none; object-fit: contain; }
    .book:has(.turn-next) {
      transform-origin: left center;
      animation: turnNext .48s cubic-bezier(.55,.02,.35,1);
    }
    .book:has(.turn-previous) {
      transform-origin: right center;
      animation: turnPrevious .48s cubic-bezier(.55,.02,.35,1);
    }
  </style>
</head>
<body class="reader-page">
  <header class="reader-header">
    <a class="home-link" href="index.html" aria-label="Return to home">Higher Authority Court Summons</a>
    <div class="download-links">
      <a href="tract.pdf" download>PDF</a>
      <a href="animated-preview.mp4">MP4</a>
    </div>
  </header>

  <main class="reader-shell">
    <section class="book-stage" aria-label="32-page illustrated gospel tract">
      <button class="page-zone previous-zone" id="previousZone" aria-label="Previous page"></button>
      <div class="book" id="book" aria-live="polite">
        <img id="pageImage" class="page-image" src="pages/page_01.jpg" alt="Illustrated tract page 1 of 32">
        <div class="page-shine" aria-hidden="true"></div>
      </div>
      <button class="page-zone next-zone" id="nextZone" aria-label="Next page"></button>
    </section>

    <section class="reader-controls" aria-label="Reader controls">
      <button id="previousButton" type="button" aria-label="Previous page">Previous</button>
      <div class="page-status"><span id="currentPage">1</span> <span aria-hidden="true">/</span> <span class="sr-only">of</span> 32</div>
      <button id="playButton" type="button" aria-pressed="false">Auto play</button>
      <button id="nextButton" type="button" aria-label="Next page">Next</button>
    </section>
    <input id="pageSlider" class="page-slider" type="range" min="1" max="32" value="1" aria-label="Choose page">
  </main>

  <script src="app.js"></script>
</body>
</html>
